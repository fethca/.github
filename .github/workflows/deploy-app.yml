name: Deploy app

on:
  workflow_call:
    inputs:
      test:
        description: Run the unit tests before building
        type: boolean
        default: true

env:
  APP: ${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format --check
      - if: inputs.test
        run: pnpm test:unit

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker build -t fethca/$APP:latest .
          docker push fethca/$APP:latest

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP
          script: |
            set -e
            exec 9>/tmp/deploy.lock
            flock 9
            cd ~/traefik
            docker-compose config --services | grep "^$APP" | xargs -r docker-compose pull
            docker-compose config --services | grep "^$APP" | xargs -r docker-compose up -d --remove-orphans
            docker image prune -f
