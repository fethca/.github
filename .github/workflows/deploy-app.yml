name: Deploy app

on:
  workflow_call:
    inputs:
      test:
        description: Run the unit tests before building
        type: boolean
        default: true

env:
  APP: ${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format --check
      - if: inputs.test
        run: pnpm test:unit

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker build -t fethca/$APP:latest .
          docker push fethca/$APP:latest

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP
          script: |
            containers=$(docker ps -a -q --filter "name=$APP")
            if [ -n "$containers" ]; then docker stop $containers && docker rm $containers; fi
            if [ "$(docker images -q fethca/$APP)" ]; then docker rmi fethca/$APP; fi

            cd ~/traefik
            for service in $(docker-compose config --services); do
              if [[ $service == $APP* ]]; then docker-compose up --remove-orphans -d $service; fi
            done
